name: poll
on:
  schedule: [{cron: "*/5 * * * *"}]   # GitHub may delay/skip runs; see README
  workflow_dispatch:
    inputs:
      send_all: {description: Email a snapshot of everything now, default: "0"}
      recent_hours: {description: With send_all - only items from the last N hours, default: ""}
      test_email: {description: Send a test email only, default: "0"}
concurrency: poll
permissions: {contents: write}
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python poll.py
        env:
          ROSS_STORAGE_STATE: ${{ secrets.ROSS_STORAGE_STATE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SEND_ALL: ${{ github.event.inputs.send_all }}
          RECENT_HOURS: ${{ github.event.inputs.recent_hours }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          ALERT_EMAIL: neerajb@umich.edu
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add seen.json && (git commit -m "update seen" && git push) || true
